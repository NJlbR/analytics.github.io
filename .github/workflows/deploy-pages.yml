name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Supabase schema from repository secret
        env:
          SUPABASE_DB_URL: ${{ secrets.supabase_db_url }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Repository secret supabase_db_url must be configured so the deploy can create/update sociopairs tables before publishing." >&2
            exit 1
          fi

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase-schema.sql

      - name: Create Supabase config from repository secrets
        env:
          SUPABASE_URL: ${{ secrets.supabase_url }}
          SUPABASE_ANON_KEY: ${{ secrets.supabase_anonpublic }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Repository secrets supabase_url and supabase_anonpublic must be configured." >&2
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const config = {
            url: process.env.SUPABASE_URL,
            anonKey: process.env.SUPABASE_ANON_KEY,
          };
          fs.writeFileSync(
            'supabase-config.js',
            `window.SOCIOPAIRS_SUPABASE = ${JSON.stringify(config, null, 2)};\n`,
          );
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
